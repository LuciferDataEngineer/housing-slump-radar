name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,stack]"
      - name: Lint
        run: ruff check src tests
      - name: Build marts and dashboard JSON
        run: housing-radar build
      - name: Confirm the committed JSON matches the marts
        run: housing-radar check
      - name: Tests
        run: pytest -q
