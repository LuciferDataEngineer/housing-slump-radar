domain: prices
name: suburb_annual
version: "1.0.0"
description: Valuer-General Victoria annual median house prices by suburb, 2015 to 2025.
file: data/tidy/suburb_annual.csv
primary_key: [locality, year]
columns:
  - name: locality
    type: string
    required: true
  - name: year
    type: integer
    required: true
    min: 2015
    max: 2025
  - name: median_price
    type: integer
    required: true
    min: 0
  - name: low_sample
    type: integer
    required: true
    allowed: [0, 1]
expectations:
  - type: min_rows
    value: 4000
